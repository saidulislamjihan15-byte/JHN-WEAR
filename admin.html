<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JHN WEAR Admin V6</title><link rel="stylesheet" href="admin.css"></head><body><header><b>JHN WEAR / ADMIN V6</b><button id="logout">LOCK</button></header><div id="login" class="login"><h1>Store Admin</h1><input id="password" type="password" placeholder="Admin password"><button id="loginBtn">LOGIN</button><small>For first test, password is 1234. Change ADMIN_PASSWORD before publishing.</small></div><main id="app" hidden><div class="stats"><div>Orders <b id="ordersCount">0</b></div><div>New <b id="newCount">0</b></div><div>Products <b id="productsCount">0</b></div><div>Sales <b id="sales">৳0</b></div></div><nav><button data-tab="orders">Orders</button><button data-tab="products">Products</button><button data-tab="settings">Settings</button></nav><section id="orders" class="panel"><h2>Orders</h2><div id="ordersList"></div></section><section id="products" class="panel" hidden><div class="row"><h2>Products</h2><button id="newProduct">+ Add</button></div><div id="productList"></div></section><section id="settings" class="panel" hidden><h2>Store Settings</h2><form id="settingsForm"><label>WhatsApp<input id="whatsapp"></label><label>Inside Dhaka<input id="dhaka" type="number"></label><label>Outside Dhaka<input id="outside" type="number"></label><label>Store phone<input id="storePhone"></label><button>Save settings</button></form></section></main><div id="productModal" class="modal" hidden><div class="box"><button id="close">×</button><h2 id="ptitle">Add Product</h2><form id="productForm"><input type="hidden" id="pid"><label>Name<input id="pname" required></label><label>Price<input id="pprice" type="number" required></label><label>Category<select id="pcat"><option>shirt</option><option>set</option><option>hoodie</option><option>tee</option><option>pants</option></select></label><label>Image URL/path<input id="pimg" required></label><label>Badge<input id="ptag"></label><button>Save product</button></form></div></div><script src="admin.js"></script></body></html>
